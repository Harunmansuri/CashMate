name: 🚀 CashMate CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: 🧪 Continuous Integration
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    defaults:
      run:
        shell: bash

    steps:
      # ----------------------------------------
      # Step 1 : Checkout Repository
      # ----------------------------------------
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # ----------------------------------------
      # Step 2 : Setup Node.js
      # ----------------------------------------
      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # ----------------------------------------
      # Step 3 : Install Frontend Dependencies
      # ----------------------------------------
      - name: 📦 Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      # ----------------------------------------
      # Step 4 : Install Backend Dependencies
      # ----------------------------------------
      - name: 📦 Install Backend Dependencies
        working-directory: backend
        run: npm ci

      # ----------------------------------------
      # Step 5 : Frontend Lint Check
      # ----------------------------------------
      - name: 🔍 Frontend Lint
        working-directory: frontend
        run: npm run lint

      # ----------------------------------------
      # Step 6 : Backend Lint Check
      # ----------------------------------------
      - name: 🔍 Backend Lint
        working-directory: backend
        run: npm run lint

      # ----------------------------------------
      # Step 7 : Type Check
      # ----------------------------------------
      - name: 📝 Type Check (Frontend)
        working-directory: frontend
        run: |
          if npm run | grep -q type-check; then
            npm run type-check
          else
            echo "No type-check script found."
          fi

      # ----------------------------------------
      # Step 8 : Backend Tests
      # ----------------------------------------
      - name: 🧪 Backend Tests
        working-directory: backend
        run: |
          if npm run | grep -q test; then
            npm test
          else
            echo "No tests found."
          fi

      # ----------------------------------------
      # Step 9 : Frontend Tests
      # ----------------------------------------
      - name: 🧪 Frontend Tests
        working-directory: frontend
        run: |
          if npm run | grep -q test; then
            npm test
          else
            echo "No tests found."
          fi

      # ----------------------------------------
      # Step 10 : Build Frontend
      # ----------------------------------------
      - name: 🏗️ Build Frontend
        working-directory: frontend
        run: npm run build

      # ----------------------------------------
      # Step 11 : Build Backend
      # ----------------------------------------
      - name: 🏗️ Build Backend
        working-directory: backend
        run: |
          if npm run | grep -q build; then
            npm run build
          else
            echo "No backend build required."
          fi

      # ----------------------------------------
      # Step 12 : Upload Frontend Build
      # ----------------------------------------
      - name: 📦 Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist

      # ----------------------------------------
      # Step 13 : Upload Backend Artifact
      # ----------------------------------------
      - name: 📦 Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-source
          path: backend/
